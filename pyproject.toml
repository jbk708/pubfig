[project]
name = "pubfig"
version = "0.2.0"
description = "Nature-format print style, annotation helpers and layout checks for matplotlib figures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest", "scipy"]
stats = ["scipy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pubfig"]
